[package]
name = "irez-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Thin MCP (stdio) server exposing the irez CLI query commands as tools"
license = "Apache-2.0"
repository = "https://github.com/yehweihsu/irez"

[dependencies]
# Official MCP Rust SDK from crates.io. A vendored checkout can be used
# instead by pointing the patch below at it, e.g.:
#   rmcp = { path = "../../Software_Repos/MCP_Rust_SDK/crates/rmcp", ... }
rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "transport-io",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "io-std",
    "io-util",
    "process",
    "time",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
